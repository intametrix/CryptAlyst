<text x="910" y="482" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">EVERY ENGINE DOES THE SAME FIVE THINGS</text>
<text x="910" y="500" fill="#8ea0b6" font-size="12.8" font-weight="400">reads market and intel state</text>
<text x="1610" y="500" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="910" y="520.8" fill="#8ea0b6" font-size="12.8" font-weight="400">asks risk.allow() before it acts</text>
<text x="1610" y="520.8" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="910" y="541.5999999999999" fill="#8ea0b6" font-size="12.8" font-weight="400">publishes model.decision, model.fill</text>
<text x="1610" y="541.5999999999999" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="910" y="562.3999999999999" fill="#8ea0b6" font-size="12.8" font-weight="400">writes its own state/pack_&lt;engine&gt;.json</text>
<text x="1610" y="562.3999999999999" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="910" y="583.1999999999998" fill="#8ea0b6" font-size="12.8" font-weight="400">exits through the shared exit policy</text>
<text x="1610" y="583.1999999999998" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="40" y="660" fill="#8ea0b6" font-size="19" text-anchor="start" font-weight="400">The families are a reading aid, not a code boundary: every engine is the same shape, and the difference is the signal it trusts.</text>
