<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="660" viewBox="0 0 1660 660" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<rect width="1660" height="660" fill="#0b1118"/>
<marker id="a-market" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9bff"/></marker>
<marker id="a-intel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38d39f"/></marker>
<marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5b544"/></marker>
<marker id="a-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6b6b"/></marker>
<marker id="a-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a879ff"/></marker>
<marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8ea3"/></marker>
<text x="40" y="50" fill="#e6eef8" font-size="25" font-weight="700">The gate — what must pass before money moves</text>
<text x="40" y="74" fill="#8ea0b6" font-size="15">authority, keying, freshness, correlation, then the arithmetic of risk</text>
<text x="1620" y="46" fill="#5a6b80" font-size="13" text-anchor="end">every refusal names the rule</text>
<rect x="40" y="130" width="200" height="110" rx="9" fill="#0f1a28" stroke="#4f9bff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="152" fill="#4f9bff" font-size="15.0" font-weight="700" letter-spacing="0.06em">AUTHORITY</text>
<text x="228" y="150" fill="#5a6b80" font-size="8.5" text-anchor="end">1</text>
<text x="50" y="170" fill="#8ea0b6" font-size="16.0" font-weight="400">interceptor</text>
<text x="230" y="170" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="262" y="130" width="200" height="110" rx="9" fill="#0f1a28" stroke="#4f9bff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="272" y="152" fill="#4f9bff" font-size="15.0" font-weight="700" letter-spacing="0.06em">KEYING</text>
<text x="450" y="150" fill="#5a6b80" font-size="8.5" text-anchor="end">2</text>
<text x="272" y="170" fill="#8ea0b6" font-size="16.0" font-weight="400">interceptor</text>
<text x="452" y="170" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 240,185 L 262,185" fill="none" stroke="#4f9bff" stroke-opacity="0.8" stroke-width="1.2" marker-end="url(#a-market)"/>
<rect x="484" y="130" width="200" height="110" rx="9" fill="#0f1a28" stroke="#4f9bff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="494" y="152" fill="#4f9bff" font-size="15.0" font-weight="700" letter-spacing="0.06em">FRESHNESS</text>
<text x="672" y="150" fill="#5a6b80" font-size="8.5" text-anchor="end">3</text>
<text x="494" y="170" fill="#8ea0b6" font-size="16.0" font-weight="400">interceptor</text>
<text x="674" y="170" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 462,185 L 484,185" fill="none" stroke="#4f9bff" stroke-opacity="0.8" stroke-width="1.2" marker-end="url(#a-market)"/>
<rect x="706" y="130" width="200" height="110" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="716" y="152" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">CORRELATION</text>
<text x="894" y="150" fill="#5a6b80" font-size="8.5" text-anchor="end">4</text>
<text x="716" y="170" fill="#8ea0b6" font-size="16.0" font-weight="400">interceptor</text>
<text x="896" y="170" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 684,185 L 706,185" fill="none" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2" marker-end="url(#a-evidence)"/>
<rect x="928" y="130" width="200" height="110" rx="9" fill="#221a10" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="938" y="152" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">RISK.ALLOW</text>
<text x="1116" y="150" fill="#5a6b80" font-size="8.5" text-anchor="end">5</text>
<text x="938" y="170" fill="#8ea0b6" font-size="16.0" font-weight="400">operator</text>
<text x="1118" y="170" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 906,185 L 928,185" fill="none" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2" marker-end="url(#a-model)"/>
<rect x="1150" y="130" width="200" height="110" rx="9" fill="#221a10" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="1160" y="152" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">SIZE_FOR</text>
<text x="1338" y="150" fill="#5a6b80" font-size="8.5" text-anchor="end">6</text>
<text x="1160" y="170" fill="#8ea0b6" font-size="16.0" font-weight="400">operator</text>
<text x="1340" y="170" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 1128,185 L 1150,185" fill="none" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2" marker-end="url(#a-model)"/>
<rect x="1372" y="130" width="200" height="110" rx="9" fill="#251315" stroke="#ef6b6b" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="1382" y="152" fill="#ef6b6b" font-size="9.5" font-weight="700" letter-spacing="0.06em">HOLD_LOSER / EXIT POLICY</text>
<text x="1560" y="230" fill="#5a6b80" font-size="8.5" text-anchor="end">7</text>
<text x="1382" y="170" fill="#8ea0b6" font-size="16.0" font-weight="400">operator</text>
<text x="1562" y="170" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 1350,185 L 1372,185" fill="none" stroke="#ef6b6b" stroke-opacity="0.8" stroke-width="1.2" marker-end="url(#a-risk)"/>
<text x="40" y="300" fill="#8ea0b6" font-size="19" text-anchor="start" font-weight="400">Each stage appends a hop. A refusal is a hop with outcome=refuse and the rule in its detail — so &#x27;why not&#x27; is answered by the same object as &#x27;why&#x27;.</text>
<rect x="40" y="360" width="500" height="180" rx="9" fill="#251315" stroke="#ef6b6b" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="382" fill="#ef6b6b" font-size="15.0" font-weight="700" letter-spacing="0.06em">WHAT THE GATE CHECKS</text>
<text x="50" y="400" fill="#8ea0b6" font-size="14.333333333333332" font-weight="400">size above zero</text>
<text x="530" y="400" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="422.3333333333333" fill="#8ea0b6" font-size="14.333333333333332" font-weight="400">forecast age ≤ limit</text>
<text x="530" y="422.3333333333333" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="444.66666666666663" fill="#8ea0b6" font-size="14.333333333333332" font-weight="400">signal age ≤ limit</text>
<text x="530" y="444.66666666666663" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="466.99999999999994" fill="#8ea0b6" font-size="14.333333333333332" font-weight="400">kill switch clear</text>
<text x="530" y="466.99999999999994" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="489.33333333333326" fill="#8ea0b6" font-size="14.333333333333332" font-weight="400">gross multiple ≤ limit</text>
<text x="530" y="489.33333333333326" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="511.6666666666666" fill="#8ea0b6" font-size="14.333333333333332" font-weight="400">symbol share ≤ limit</text>
<text x="530" y="511.6666666666666" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="580" y="360" width="500" height="180" rx="9" fill="#221a10" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="590" y="382" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">WHAT THE BOOK THEN DOES</text>
<text x="590" y="400" fill="#8ea0b6" font-size="16.0" font-weight="400">size = equity · risk / stop</text>
<text x="1070" y="400" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="590" y="424.0" fill="#8ea0b6" font-size="16.0" font-weight="400">cap at a quarter of equity</text>
<text x="1070" y="424.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="590" y="448.0" fill="#8ea0b6" font-size="16.0" font-weight="400">take profit above the cost floor</text>
<text x="1070" y="448.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="590" y="472.0" fill="#8ea0b6" font-size="16.0" font-weight="400">stop, time cap, or target</text>
<text x="1070" y="472.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="1120" y="360" width="500" height="180" rx="9" fill="#151b24" stroke="#7f8ea3" stroke-opacity="0.8" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1130" y="382" fill="#7f8ea3" font-size="15.0" font-weight="700" letter-spacing="0.06em">WHAT IS NEVER TRUE</text>
<text x="1130" y="400" fill="#8ea0b6" font-size="16.0" font-weight="400">a losing exit is not refused</text>
<text x="1610" y="400" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1130" y="424.0" fill="#8ea0b6" font-size="16.0" font-weight="400">a stop is not widened</text>
<text x="1610" y="424.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1130" y="448.0" fill="#8ea0b6" font-size="16.0" font-weight="400">a stopped book does not trade</text>
<text x="1610" y="448.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1130" y="472.0" fill="#8ea0b6" font-size="16.0" font-weight="400">a refusal is not silent</text>
<text x="1610" y="472.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
</svg>