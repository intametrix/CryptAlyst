<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="680" viewBox="0 0 1660 680" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<rect width="1660" height="680" fill="#0b1118"/>
<marker id="a-market" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9bff"/></marker>
<marker id="a-intel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38d39f"/></marker>
<marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5b544"/></marker>
<marker id="a-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6b6b"/></marker>
<marker id="a-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a879ff"/></marker>
<marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8ea3"/></marker>
<text x="40" y="50" fill="#e6eef8" font-size="25" font-weight="700">The recorder — the only writer of the record</text>
<text x="40" y="74" fill="#8ea0b6" font-size="15">one consumer per topic, interceptors run one by one, hops recorded as they pass</text>
<text x="1620" y="46" fill="#5a6b80" font-size="13" text-anchor="end">read-only elsewhere</text>
<rect x="40" y="120" width="300" height="170" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="142" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">BUS</text>
<text x="50" y="160" fill="#8ea0b6" font-size="16.0" font-weight="400">topic exchange</text>
<text x="330" y="160" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="184.0" fill="#e6eef8" font-size="16.0" font-weight="600">q.rec.&lt;topic&gt;</text>
<text x="330" y="184.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<rect x="390" y="100" width="360" height="220" rx="9" fill="#251315" stroke="#ef6b6b" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="400" y="122" fill="#ef6b6b" font-size="15.0" font-weight="700" letter-spacing="0.06em">INTERCEPTORS</text>
<text x="738" y="120" fill="#5a6b80" font-size="8.5" text-anchor="end">each hop recorded</text>
<text x="400" y="140" fill="#e6eef8" font-size="16.0" font-weight="600">authority — pass / refuse</text>
<text x="740" y="140" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="400" y="164.0" fill="#e6eef8" font-size="16.0" font-weight="600">keying</text>
<text x="740" y="164.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="400" y="188.0" fill="#e6eef8" font-size="16.0" font-weight="600">freshness</text>
<text x="740" y="188.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="400" y="212.0" fill="#e6eef8" font-size="16.0" font-weight="600">correlation</text>
<text x="740" y="212.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<rect x="800" y="100" width="340" height="220" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="810" y="122" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">RECORD</text>
<text x="810" y="140" fill="#8ea0b6" font-size="16.0" font-weight="400">attach derived refs</text>
<text x="1130" y="140" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="810" y="164.0" fill="#e6eef8" font-size="16.0" font-weight="600">append to the journal</text>
<text x="1130" y="164.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="810" y="188.0" fill="#8ea0b6" font-size="16.0" font-weight="400">publish to the live feed</text>
<text x="1130" y="188.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">SERVICE</text>
<rect x="1190" y="100" width="420" height="220" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="1200" y="122" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">LAKE</text>
<text x="1598" y="120" fill="#5a6b80" font-size="8.5" text-anchor="end">append only</text>
<text x="1200" y="140" fill="#8ea0b6" font-size="16.0" font-weight="400">one line, one envelope</text>
<text x="1600" y="140" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1200" y="164.0" fill="#e6eef8" font-size="16.0" font-weight="600">state/lake3/*.jsonl</text>
<text x="1600" y="164.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="1200" y="188.0" fill="#8ea0b6" font-size="16.0" font-weight="400">indexed by topic offsets</text>
<text x="1600" y="188.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 340,200 L 390,200" fill="none" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#a-evidence)"/>
<path d="M 750,200 L 800,200" fill="none" stroke="#ef6b6b" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#a-risk)"/>
<path d="M 1140,200 L 1190,200" fill="none" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#a-evidence)"/>
<text x="40" y="340" fill="#8ea0b6" font-size="19" text-anchor="start" font-weight="400">A refused envelope is recorded too, with extra.refused = true. The record therefore contains what did not happen.</text>
<rect x="40" y="400" width="500" height="190" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="422" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">DERIVED REFERENCES</text>
<text x="50" y="440" fill="#8ea0b6" font-size="16.0" font-weight="400">newest input per topic, within 5 minutes</text>
<text x="530" y="440" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="464.0" fill="#8ea0b6" font-size="16.0" font-weight="400">marked derived: true</text>
<text x="530" y="464.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="488.0" fill="#8ea0b6" font-size="16.0" font-weight="400">carries age_ms at decision time</text>
<text x="530" y="488.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="580" y="400" width="500" height="190" rx="9" fill="#221a10" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="590" y="422" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">WHY DERIVED EXISTS</text>
<text x="590" y="440" fill="#8ea0b6" font-size="16.0" font-weight="400">books do not declare their inputs</text>
<text x="1070" y="440" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="590" y="464.0" fill="#8ea0b6" font-size="16.0" font-weight="400">without it, a decision has no parents</text>
<text x="1070" y="464.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="590" y="488.0" fill="#8ea0b6" font-size="16.0" font-weight="400">with it, a chain can be walked</text>
<text x="1070" y="488.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="1120" y="400" width="490" height="190" rx="9" fill="#151b24" stroke="#7f8ea3" stroke-opacity="0.8" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1130" y="422" fill="#7f8ea3" font-size="15.0" font-weight="700" letter-spacing="0.06em">WHAT IT IS NOT</text>
<text x="1130" y="440" fill="#8ea0b6" font-size="16.0" font-weight="400">not a claim the producer made</text>
<text x="1600" y="440" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1130" y="464.0" fill="#8ea0b6" font-size="16.0" font-weight="400">not a substitute for declared refs</text>
<text x="1600" y="464.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1130" y="488.0" fill="#8ea0b6" font-size="16.0" font-weight="400">always labelled, never implied</text>
<text x="1600" y="488.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
</svg>