<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="700" viewBox="0 0 1660 700" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<rect width="1660" height="700" fill="#0b1118"/>
<marker id="a-market" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9bff"/></marker>
<marker id="a-intel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38d39f"/></marker>
<marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5b544"/></marker>
<marker id="a-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6b6b"/></marker>
<marker id="a-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a879ff"/></marker>
<marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8ea3"/></marker>
<text x="40" y="50" fill="#e6eef8" font-size="25" font-weight="700">Data stores, as they exist on this machine</text>
<text x="40" y="74" fill="#8ea0b6" font-size="15">what is written where, in which format, who writes it and who may read it</text>
<text x="1620" y="46" fill="#5a6b80" font-size="12.5" text-anchor="end">60 GB of journal · 105 state files · 8 ledgers</text>
<rect x="40" y="110" width="380" height="150" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="132" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">THE LAKE</text>
<text x="408" y="130" fill="#5a6b80" font-size="8.5" text-anchor="end">bronze</text>
<text x="50" y="150" fill="#e6eef8" font-size="16.0" font-weight="600">state/lake3/envelopes.jsonl</text>
<text x="410" y="150" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="50" y="174.0" fill="#8ea0b6" font-size="16.0" font-weight="400">60.2 GB · one journal</text>
<text x="410" y="174.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="198.0" fill="#8ea0b6" font-size="16.0" font-weight="400">JSONL, one envelope per line</text>
<text x="410" y="198.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="222.0" fill="#8ea0b6" font-size="16.0" font-weight="400">writer: the recorder</text>
<text x="410" y="222.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">SERVICE</text>
<rect x="470" y="110" width="380" height="150" rx="9" fill="#0d1f1a" stroke="#38d39f" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="480" y="132" fill="#38d39f" font-size="15.0" font-weight="700" letter-spacing="0.06em">DERIVED DATASETS</text>
<text x="838" y="130" fill="#5a6b80" font-size="8.5" text-anchor="end">silver · gold</text>
<text x="480" y="150" fill="#e6eef8" font-size="16.0" font-weight="600">datasets/features.csv</text>
<text x="840" y="150" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="480" y="174.0" fill="#e6eef8" font-size="16.0" font-weight="600">datasets/manifest.json</text>
<text x="840" y="174.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="480" y="198.0" fill="#e6eef8" font-size="16.0" font-weight="600">datasets/model/*.json</text>
<text x="840" y="198.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="480" y="222.0" fill="#8ea0b6" font-size="16.0" font-weight="400">writer: the historian</text>
<text x="840" y="222.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">SERVICE</text>
<rect x="900" y="110" width="340" height="150" rx="9" fill="#221a10" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="910" y="132" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">LIVE STATE</text>
<text x="1228" y="130" fill="#5a6b80" font-size="8.5" text-anchor="end">not a record</text>
<text x="910" y="150" fill="#e6eef8" font-size="16.0" font-weight="600">state/pack_*.json</text>
<text x="1230" y="150" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="910" y="174.0" fill="#e6eef8" font-size="16.0" font-weight="600">state/strategy_*.json</text>
<text x="1230" y="174.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="910" y="198.0" fill="#8ea0b6" font-size="16.0" font-weight="400">105 files, rewritten in place</text>
<text x="1230" y="198.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="1290" y="110" width="330" height="150" rx="9" fill="#151b24" stroke="#7f8ea3" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="1300" y="132" fill="#7f8ea3" font-size="15.0" font-weight="700" letter-spacing="0.06em">OBSERVABILITY</text>
<text x="1608" y="130" fill="#5a6b80" font-size="8.5" text-anchor="end">diagnostic</text>
<text x="1300" y="150" fill="#e6eef8" font-size="16.0" font-weight="600">logs/*.log</text>
<text x="1610" y="150" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="1300" y="174.0" fill="#8ea0b6" font-size="16.0" font-weight="400">104 MB · 115 files</text>
<text x="1610" y="174.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1300" y="198.0" fill="#e6eef8" font-size="16.0" font-weight="600">bridge/messages.jsonl</text>
<text x="1610" y="198.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<rect x="40" y="380" width="380" height="150" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="402" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">OLDER JOURNALS</text>
<text x="408" y="400" fill="#5a6b80" font-size="8.5" text-anchor="end">cold</text>
<text x="50" y="420" fill="#e6eef8" font-size="16.0" font-weight="600">state/lake/</text>
<text x="410" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="50" y="444.0" fill="#e6eef8" font-size="16.0" font-weight="600">state/lake2/</text>
<text x="410" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="50" y="468.0" fill="#e6eef8" font-size="16.0" font-weight="600">state/lake4/</text>
<text x="410" y="468.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="50" y="492.0" fill="#8ea0b6" font-size="16.0" font-weight="400">kept for replay comparison</text>
<text x="410" y="492.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="470" y="380" width="380" height="150" rx="9" fill="#221a10" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="480" y="402" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">LEDGERS</text>
<text x="838" y="400" fill="#5a6b80" font-size="8.5" text-anchor="end">append only</text>
<text x="480" y="420" fill="#e6eef8" font-size="16.0" font-weight="600">ledger/*.jsonl</text>
<text x="840" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="480" y="444.0" fill="#8ea0b6" font-size="14.5" font-weight="400">one file per engine, written by the engine</text>
<text x="840" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="480" y="466.5" fill="#e6eef8" font-size="16.0" font-weight="600">state/fills.jsonl</text>
<text x="840" y="466.5" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<rect x="900" y="380" width="340" height="150" rx="9" fill="#151b24" stroke="#7f8ea3" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="910" y="402" fill="#7f8ea3" font-size="15.0" font-weight="700" letter-spacing="0.06em">ARCHIVES</text>
<text x="1228" y="400" fill="#5a6b80" font-size="8.5" text-anchor="end">recoverable</text>
<text x="910" y="420" fill="#e6eef8" font-size="16.0" font-weight="600">state/archive_stop_*</text>
<text x="1230" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="910" y="444.0" fill="#e6eef8" font-size="16.0" font-weight="600">state/archive_*</text>
<text x="1230" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="910" y="468.0" fill="#8ea0b6" font-size="16.0" font-weight="400">a copy before every reset</text>
<text x="1230" y="468.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="1290" y="380" width="330" height="150" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="1300" y="402" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">IN MEMORY</text>
<text x="1608" y="400" fill="#5a6b80" font-size="8.5" text-anchor="end">index</text>
<text x="1300" y="420" fill="#e6eef8" font-size="16.0" font-weight="600">topic → byte offsets</text>
<text x="1610" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="1300" y="444.0" fill="#8ea0b6" font-size="16.0" font-weight="400">the newest 20,000 envelopes</text>
<text x="1610" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1300" y="468.0" fill="#8ea0b6" font-size="16.0" font-weight="400">disposable, rebuilt on boot</text>
<text x="1610" y="468.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 420,185 L 470,185" fill="none" stroke="#38d39f" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#a-intel)"/>
<text x="470" y="292" fill="#8ea0b6" font-size="9.5" text-anchor="start" font-weight="400">the historian reads the journal and writes the datasets</text>
<path d="M 1240,300 L 1240,380" fill="none" stroke="#7f8ea3" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#a-control)"/>
<text x="1250" y="340" fill="#8ea0b6" font-size="9.0" text-anchor="start">before a reset</text>
<text x="40" y="590" fill="#8ea0b6" font-size="10" text-anchor="start" font-weight="400">The journal is the record. Everything else here is derived from it, a cache of it, or a copy taken before something was reset.</text>
<text x="40" y="612" fill="#8ea0b6" font-size="10" text-anchor="start" font-weight="400">Only the ledgers and the logs are written by more than one process, and both are append-only.</text>
</svg>