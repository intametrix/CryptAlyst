<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="720" viewBox="0 0 1660 720" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<rect width="1660" height="720" fill="#0b1118"/>
<marker id="a-market" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9bff"/></marker>
<marker id="a-intel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38d39f"/></marker>
<marker id="a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5b544"/></marker>
<marker id="a-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6b6b"/></marker>
<marker id="a-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a879ff"/></marker>
<marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8ea3"/></marker>
<text x="40" y="50" fill="#e6eef8" font-size="25" font-weight="700">The lake — what is actually on disk</text>
<text x="40" y="74" fill="#8ea0b6" font-size="15">one journal per era, one line per envelope, rotated, compressed, expired</text>
<text x="1620" y="46" fill="#5a6b80" font-size="13" text-anchor="end">the record is a file</text>
<rect x="40" y="110" width="420" height="210" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="132" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">DIRECTORY</text>
<text x="448" y="130" fill="#5a6b80" font-size="8.5" text-anchor="end">append only</text>
<text x="50" y="150" fill="#e6eef8" font-size="16.0" font-weight="600">state/lake3/</text>
<text x="450" y="150" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="50" y="174.0" fill="#e6eef8" font-size="16.0" font-weight="600">envelopes.jsonl</text>
<text x="450" y="174.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="50" y="198.0" fill="#e6eef8" font-size="16.0" font-weight="600">seg-*.jsonl</text>
<text x="450" y="198.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="50" y="222.0" fill="#e6eef8" font-size="16.0" font-weight="600">*.gz — sealed segments</text>
<text x="450" y="222.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<rect x="520" y="110" width="460" height="210" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="530" y="132" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">LINE FORMAT</text>
<text x="530" y="150" fill="#8ea0b6" font-size="16.0" font-weight="400">one JSON object per line</text>
<text x="970" y="150" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="530" y="174.0" fill="#8ea0b6" font-size="16.0" font-weight="400">{topic, key, ts, payload}</text>
<text x="970" y="174.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="530" y="198.0" fill="#8ea0b6" font-size="16.0" font-weight="400">payload is the envelope</text>
<text x="970" y="198.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="1040" y="110" width="580" height="210" rx="9" fill="#221a10" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="1050" y="132" fill="#f5b544" font-size="15.0" font-weight="700" letter-spacing="0.06em">INDEX</text>
<text x="1608" y="130" fill="#5a6b80" font-size="8.5" text-anchor="end">in memory</text>
<text x="1050" y="150" fill="#e6eef8" font-size="16.0" font-weight="600">topic → byte offsets</text>
<text x="1610" y="150" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">ENTITY</text>
<text x="1050" y="174.0" fill="#8ea0b6" font-size="16.0" font-weight="400">built once, extended on append</text>
<text x="1610" y="174.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1050" y="198.0" fill="#8ea0b6" font-size="16.0" font-weight="400">refresh throttled to 30 s</text>
<text x="1610" y="198.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1050" y="222.0" fill="#8ea0b6" font-size="16.0" font-weight="400">cold query reads a handful of lines</text>
<text x="1610" y="222.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<path d="M 460,200 L 520,200" fill="none" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#a-evidence)"/>
<path d="M 980,200 L 1040,200" fill="none" stroke="#f5b544" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#a-model)"/>
<rect x="40" y="380" width="300" height="190" rx="9" fill="#151b24" stroke="#7f8ea3" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="50" y="402" fill="#7f8ea3" font-size="15.0" font-weight="700" letter-spacing="0.06em">RETENTION</text>
<text x="50" y="420" fill="#8ea0b6" font-size="16.0" font-weight="400">rotate at a size</text>
<text x="330" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="444.0" fill="#8ea0b6" font-size="16.0" font-weight="400">gzip the sealed file</text>
<text x="330" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="50" y="468.0" fill="#8ea0b6" font-size="16.0" font-weight="400">expire after a window</text>
<text x="330" y="468.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="380" y="380" width="380" height="190" rx="9" fill="#0d1f1a" stroke="#38d39f" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="390" y="402" fill="#38d39f" font-size="15.0" font-weight="700" letter-spacing="0.06em">TIERS</text>
<text x="390" y="420" fill="#e6eef8" font-size="16.0" font-weight="600">bronze — raw journal</text>
<text x="750" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">STATE</text>
<text x="390" y="444.0" fill="#e6eef8" font-size="16.0" font-weight="600">silver — features</text>
<text x="750" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">STATE</text>
<text x="390" y="468.0" fill="#e6eef8" font-size="16.0" font-weight="600">gold — datasets</text>
<text x="750" y="468.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">STATE</text>
<text x="390" y="492.0" fill="#e6eef8" font-size="16.0" font-weight="600">archive — cold</text>
<text x="750" y="492.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">STATE</text>
<rect x="800" y="380" width="380" height="190" rx="9" fill="#1a1528" stroke="#a879ff" stroke-opacity="0.8" stroke-width="1.2"/>
<text x="810" y="402" fill="#a879ff" font-size="15.0" font-weight="700" letter-spacing="0.06em">REPLAY</text>
<text x="810" y="420" fill="#8ea0b6" font-size="16.0" font-weight="400">replay a window</text>
<text x="1170" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">SERVICE</text>
<text x="810" y="444.0" fill="#8ea0b6" font-size="16.0" font-weight="400">same envelopes, same order</text>
<text x="1170" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="810" y="468.0" fill="#8ea0b6" font-size="16.0" font-weight="400">rebuild derived state</text>
<text x="1170" y="468.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<rect x="1220" y="380" width="400" height="190" rx="9" fill="#151b24" stroke="#7f8ea3" stroke-opacity="0.8" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1230" y="402" fill="#7f8ea3" font-size="15.0" font-weight="700" letter-spacing="0.06em">BENEATH THE LAKE</text>
<text x="1230" y="420" fill="#8ea0b6" font-size="16.0" font-weight="400">the filesystem, and nothing else</text>
<text x="1610" y="420" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1230" y="444.0" fill="#8ea0b6" font-size="16.0" font-weight="400">no database, no queue, no cache</text>
<text x="1610" y="444.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="1230" y="468.0" fill="#8ea0b6" font-size="16.0" font-weight="400">readable with grep and jq</text>
<text x="1610" y="468.0" fill="#5a6b80" font-size="11" text-anchor="end" letter-spacing="0.04em">VALUE</text>
<text x="40" y="620" fill="#8ea0b6" font-size="19" text-anchor="start" font-weight="400">A lake that cannot be read with grep is not a record; it is a service dependency. This one is plain JSONL, so an investigator can read it</text>
<text x="40" y="640" fill="#8ea0b6" font-size="19" text-anchor="start" font-weight="400">without the platform running — which is precisely what makes it evidence.</text>
</svg>