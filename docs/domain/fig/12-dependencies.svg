<text x="1040" y="560" fill="#8ea0b6" font-size="13.5" text-anchor="start">be restarted</text>
<text x="40" y="700" fill="#8ea0b6" font-size="19" text-anchor="start" font-weight="400">An engine may not talk to the exchange, may not write the lake, and may not decide its own size:</text>
<text x="40" y="728" fill="#8ea0b6" font-size="19" text-anchor="start" font-weight="400">those three refusals are what make forty engines safe to run at once.</text>
