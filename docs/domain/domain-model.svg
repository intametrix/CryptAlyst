<rect x="263.6" y="750" width="10" height="10" rx="2" fill="#ef6b6b"/>
<text x="279.6" y="759" fill="#8ea0b6" font-size="10.5">risk</text>
<rect x="311.20000000000005" y="750" width="10" height="10" rx="2" fill="#a879ff"/>
<text x="327.20000000000005" y="759" fill="#8ea0b6" font-size="10.5">evidence</text>
<rect x="384.40000000000003" y="750" width="10" height="10" rx="2" fill="#7f8ea3"/>
<text x="400.40000000000003" y="759" fill="#8ea0b6" font-size="10.5">control</text>
<text x="66" y="788" fill="#8ea0b6" font-size="10.5">Bold names are aggregates — the things that must stay consistent. Others are entities, services or values.</text>
<text x="66" y="808" fill="#8ea0b6" font-size="10.5">Dashed arrows are control, not data: they change what the platform will do next.</text>
<text x="66" y="828" fill="#5a6b80" font-size="10">Every arrow in this diagram carries an envelope; there is one bus and no side channels.</text>
