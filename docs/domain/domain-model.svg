<text x="1318" y="470" fill="#8ea0b6" font-size="9.5" text-anchor="end">supervises books, publishes system.control</text>
<text x="1614" y="560" fill="#8ea0b6" font-size="9.5" text-anchor="end">STOP resets books and stats;</text>
<text x="1614" y="574" fill="#8ea0b6" font-size="9.5" text-anchor="end">market data keeps running.</text>
<text x="1614" y="592" fill="#8ea0b6" font-size="9.5" text-anchor="end">The kill switch is read by</text>
<text x="1614" y="606" fill="#8ea0b6" font-size="9.5" text-anchor="end">every gate, never hoped for.</text>
<rect x="872" y="700" width="760" height="150" rx="10" fill="#0d141d" stroke="#233244"/>
<text x="892" y="730" fill="#e6eef8" font-size="12" font-weight="700" letter-spacing="0.08em">THE CONTRACT</text>
<text x="892" y="756" fill="#8ea0b6" font-size="11.5">Envelope = data + meta + refs. meta carries version, plane, topic, producer, generation, cid, computed_at, hops.</text>
<text x="892" y="778" fill="#8ea0b6" font-size="11.5">Unknown top-level member refused · unknown meta key ignored · one previous version accepted.</text>
<text x="892" y="800" fill="#8ea0b6" font-size="11.5">A reference is declared by a producer or derived by the recorder, and always carries its age.</text>
<rect x="48" y="700" width="800" height="150" rx="10" fill="#0d141d" stroke="#233244"/>
<text x="66" y="730" fill="#e6eef8" font-size="12" font-weight="700" letter-spacing="0.08em">READING THIS</text>
<rect x="66" y="750" width="10" height="10" rx="2" fill="#4f9bff"/>
<text x="82" y="759" fill="#8ea0b6" font-size="10.5">data plane</text>
<rect x="152.0" y="750" width="10" height="10" rx="2" fill="#f5b544"/>
